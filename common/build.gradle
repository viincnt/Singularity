plugins {
    // Minecraft 26.x ships unobfuscated: `net.fabricmc.fabric-loom` (not the
    // classic `fabric-loom`) is Loom's non-remapping variant for versions
    // where there's nothing to deobfuscate and no Mojang mappings are
    // published, so it needs no `mappings` dependency at all.
    id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}"
    id 'org.jetbrains.kotlin.jvm'
}

base { archivesName = "${mod_id}-common" }

repositories {
    mavenCentral()
    maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
}

// Not a runnable mod by itself: neoforge/ and fabric/ each depend on this
// module's compiled output and supply their own loader entrypoint. Since
// Minecraft 26.x is unobfuscated, both loaders see identical class/method
// names, so the mixins/render/native-bridge code below targets
// `net.minecraft`/`com.mojang` classes directly for either loader.
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // kotlin.stdlib.default.dependency=false (gradle.properties) disables the
    // Kotlin Gradle plugin's automatic stdlib dependency project-wide, so it
    // must be declared explicitly here (neoforge/fabric already get it
    // transitively through KotlinForForge / Fabric Language Kotlin).
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
    // Mixin annotations only; each loader supplies the real implementation at
    // runtime (NeoForge ships org.spongepowered:mixin, Fabric ships its
    // net.fabricmc:sponge-mixin fork of the same org.spongepowered.asm API).
    compileOnly "org.spongepowered:mixin:0.8.7"
}

kotlin {
    jvmToolchain(25)
}
